version: 2
# Noise control: pause automatic PRs (re-enable by raising open-pull-requests-limit).
# Historical Dependabot PR titles flooded GitHub notifications.
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
    groups:
      pip-all:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"

